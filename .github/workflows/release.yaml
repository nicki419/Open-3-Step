name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
        sudo apt update
        sudo apt install --install-recommends kicad openscad platformio
    
    - name: Make build script executable
      run: chmod +x release.sh
    
    - name: Run build script
      run: ./release.sh
    
    - name: Create Release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          Automated release containing:
          - 3D printable STL files
          - KiCad gerber files and schematics  
          - Firmware binaries for multiple delay configurations
          - Complete project source
        draft: false
        prerelease: false
    
    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ./lamp-3-step-release.zip
        asset_name: lamp-3-step-release.zip
        asset_content_type: application/zip
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: lamp-3-step-release
        path: lamp-3-step-release.zip